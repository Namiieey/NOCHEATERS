<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>server down · 503</title>
  <style>
    /* minimal reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e14;
      font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* subtle animated grid — not distracting */
    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(45, 95, 180, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 95, 180, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: drift 32s linear infinite;
      pointer-events: none;
    }

    @keyframes drift {
      0% { background-position: 0 0; }
      100% { background-position: 120px 80px; }
    }

    /* main card */
    .down-card {
      background: rgba(18, 24, 36, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(72, 120, 212, 0.22);
      border-radius: 2rem;
      padding: 3.5rem 2.5rem;
      max-width: 740px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 30px 50px -15px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      position: relative;
      z-index: 10;
      transition: box-shadow 0.3s ease;
    }

    .down-card:hover {
      box-shadow: 
        0 35px 60px -15px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(80, 140, 255, 0.2) inset;
    }

    /* glitchy server icon */
    .icon-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 2.2rem;
      color: #567bce;
      position: relative;
    }

    .server-icon {
      width: 84px;
      height: 84px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      filter: drop-shadow(0 0 12px rgba(86, 123, 206, 0.35));
      transition: filter 0.2s;
    }

    /* tiny "disconnected" pulse */
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #f05f5f;
      border-radius: 50%;
      position: absolute;
      right: 14px;
      top: 14px;
      box-shadow: 0 0 12px #f05f5f;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.35); }
    }

    /* status badge */
    .status-tag {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
      color: #ffaa5e;
      background: rgba(255, 170, 94, 0.1);
      border: 1px solid rgba(255, 170, 94, 0.25);
      border-radius: 60px;
      padding: 0.45rem 1.3rem;
      margin-bottom: 1.8rem;
      backdrop-filter: blur(4px);
    }

    h1 {
      font-size: clamp(2.8rem, 10vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #eef4ff;
      margin-bottom: 0.75rem;
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 20, 60, 0.8);
    }

    h1 span {
      color: #6f9bff;
      display: inline-block;
    }

    .subhead {
      font-size: 1.2rem;
      color: #8e9bb5;
      max-width: 480px;
      margin: 0 auto 2.5rem auto;
      line-height: 1.6;
      font-weight: 400;
      border-bottom: 1px dashed rgba(110, 150, 230, 0.2);
      padding-bottom: 1.8rem;
    }

    /* details panel */
    .details {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem 1.5rem;
      margin-bottom: 2.8rem;
      font-size: 0.95rem;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #a5b3cf;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.6rem 1.3rem;
      border-radius: 40px;
      border: 1px solid rgba(90, 130, 200, 0.15);
    }

    .detail-item svg {
      width: 18px;
      height: 18px;
      stroke: #6f8fd6;
      stroke-width: 1.8;
      fill: none;
      flex-shrink: 0;
    }

    .detail-item strong {
      color: #d6e3ff;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* retry button — fake but polite */
    .retry-btn {
      background: #1f2a44;
      border: 1px solid #39518b;
      color: #e0eaff;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      cursor: default;   /* no actual action — server is down */
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      letter-spacing: 0.01em;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.6);
      pointer-events: none;   /* intentionally non-interactive, just visual */
      user-select: none;
    }

    /* make it look disabled but still elegant */
    .retry-btn svg {
      width: 18px;
      height: 18px;
      stroke: #9bb6f0;
      stroke-width: 2;
      fill: none;
      transition: transform 0.2s;
    }

    .retry-btn:hover {
      background: #253456;
      border-color: #5270b0;
      box-shadow: 0 10px 24px -8px #1a2a50;
    }

    /* small hint */
    .hint {
      margin-top: 2.2rem;
      font-size: 0.8rem;
      color: #4f5e7c;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .hint svg {
      width: 14px;
      height: 14px;
      stroke: #4f5e7c;
      stroke-width: 2;
      fill: none;
    }

    /* responsive adjustments */
    @media (max-width: 480px) {
      .down-card {
        padding: 2.5rem 1.5rem;
        border-radius: 1.75rem;
      }
      .details {
        gap: 0.9rem;
      }
      .detail-item {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
      }
      .subhead {
        font-size: 1rem;
      }
      .status-tag {
        font-size: 0.7rem;
        padding: 0.35rem 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- animated background grid -->
  <div class="grid-bg" aria-hidden="true"></div>

  <!-- main server down card -->
  <div class="down-card" role="main" aria-labelledby="server-down-title">
    
    <!-- icon with pulsing dot -->
    <div class="icon-wrap">
      <svg class="server-icon" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- server rack simplified -->
        <rect x="8" y="12" width="44" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="8" y="26" width="44" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="8" y="40" width="44" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
        <!-- little circles / leds -->
        <circle cx="15" cy="17" r="2" fill="currentColor" stroke="none" opacity="0.7"/>
        <circle cx="15" cy="31" r="2" fill="currentColor" stroke="none" opacity="0.7"/>
        <circle cx="15" cy="45" r="2" fill="currentColor" stroke="none" opacity="0.7"/>
        <!-- cross lines (error hint) -->
        <line x1="40" y1="15" x2="44" y2="19" stroke="#f05f5f" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="44" y1="15" x2="40" y2="19" stroke="#f05f5f" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <div class="pulse-dot" aria-hidden="true"></div>
    </div>

    <!-- status badge -->
    <div class="status-tag">⚠️ server offline</div>

    <!-- main title -->
    <h1 id="server-down-title">
      server <span>down</span>
    </h1>

    <!-- supporting text -->
    <div class="subhead">
      We are experiencing technical difficulties.<br>
      The service is temporarily unavailable.
    </div>

    <!-- extra details / meta -->
    <div class="details">
      <div class="detail-item">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <strong>503</strong> service unavailable
      </div>
      <div class="detail-item">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <strong>maintenance</strong> in progress
      </div>
    </div>

    <!-- fake retry button (non-interactive) -->
    <div class="retry-btn" aria-disabled="true" role="button" tabindex="-1">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
      </svg>
      retry connection
    </div>

    <!-- subtle footer hint -->
    <div class="hint">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>system is recovering · please check back shortly</span>
    </div>
  </div>
</body>
</html>
